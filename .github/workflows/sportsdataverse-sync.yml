name: SportsDataverse sync

on:
  workflow_dispatch:
    inputs:
      sports:
        description: Sports to refresh (comma separated)
        required: false
        default: nhl,nba,wnba,nfl,mlb
      season:
        description: Season start year (blank = current UTC year)
        required: false
  schedule:
    - cron: "43 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/sportsdataverse-sync-trigger

permissions:
  contents: write

concurrency:
  group: betlab-sportsdataverse-sync-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare named sync branch
        shell: bash
        run: |
          git fetch origin main
          git switch -C sportsdataverse-sync-work origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SportsDataverse adapter
        run: pip install -r scripts/requirements-sportsdataverse.txt
      - name: Refresh snapshots
        env:
          SPORTS: ${{ inputs.sports || 'nhl,nba,wnba,nfl,mlb' }}
          REQUESTED_SEASON: ${{ inputs.season }}
        shell: bash
        run: |
          SEASON="${REQUESTED_SEASON:-$(date -u +%Y)}"
          python scripts/sportsdataverse_sync.py --season "$SEASON" --sports "$SPORTS"
      - name: Commit changed snapshots
        shell: bash
        run: |
          git add data/sportsdataverse
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh SportsDataverse snapshots"
          git fetch origin main
          git rebase origin/main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Snapshot already present upstream after rebase"
            exit 0
          fi
          git push origin HEAD:main
