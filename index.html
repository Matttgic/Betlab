<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BetLab</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0;padding:18px}main{max-width:1100px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card,section{background:#131a2e;border:1px solid #26304a;border-radius:14px;padding:15px;margin:12px 0}strong{font-size:28px;display:block}.muted{color:#9aa7c7}.pill{display:inline-block;padding:4px 8px;border:1px solid #3b4969;border-radius:99px;font-size:11px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #26304a;text-align:left}h1{margin-bottom:4px}code{color:#b8c7ff}.warn{color:#ffd27a}</style></head><body><main><h1>BetLab Research Engine</h1><div class="muted">Laboratoire quantitatif · LAB → SHADOW → CANARY → PRODUCTION</div><div id="cards" class="cards"></div><section><h2>Stratégies</h2><div id="strategies">Chargement…</div></section><section><h2>Réglementaire France</h2><div id="reg">Chargement…</div></section><section><h2>État système</h2><div id="health">Chargement…</div></section></main><script>async function g(u){const r=await fetch(u);if(!r.ok)throw new Error(await r.text());return r.json()}async function load(){try{const[d,s,r,h]=await Promise.all([g('/api/dashboard'),g('/api/strategies'),g('/api/regulatory/status'),g('/api/health')]);cards.innerHTML=[['Stratégies',d.strategies],['Intraday',d.intraday],['Snapshots',d.snapshots],['Signaux',d.signals],['Shadow',d.shadow]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');strategies.innerHTML='<table><tr><th>Nom</th><th>Famille</th><th>Étape</th><th>Priorité</th></tr>'+s.items.map(x=>'<tr><td>'+x.name+'</td><td>'+x.family+'</td><td><span class="pill">'+x.stage+'</span></td><td>'+x.priority+'</td></tr>').join('')+'</table>';reg.innerHTML=r.loaded?'Règles chargées · '+r.versionDate:'<span class="warn">DEFAULT DENY — aucune règle réglementaire courante chargée</span>';health.innerHTML='<code>'+h.store+'</code> · '+h.mode+' · '+h.time}catch(e){health.textContent='Erreur: '+e.message}}load()</script></body></html>
